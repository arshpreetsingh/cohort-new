<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - truceCheck</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">truceCheck</a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/register.html" class="active">Register</a></li>
        <li><a href="/classes.html">Classes</a></li>
        <li><a href="/dashboard.html">Users</a></li>
      </ul>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <h2 class="section-title">Student Registration</h2>
      <p style="margin-bottom: 1.5rem; color: #6b7280;">Fill in your details below to register for the program.</p>

      <div id="alert" class="alert"></div>

      <form id="registerForm" style="max-width: 500px;">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required placeholder="Enter your phone number">
        </div>
        <button type="submit" class="btn" id="submitBtn">Register</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2026 truceCheck. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
